[project]
name = "sistema-contable-py"
version = "0.1.0"
requires-python = ">=3.11"
description = "Automatización contable IVA/IRP Paraguay (RG90 / Marangatú)"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
