{% extends "base.html" %}
{% block title %}Comprobantes · Sistema Contable{% endblock %}
{% block content %}
<div class="card"><h2>Comprobantes (ABM)</h2>
<label>Cliente <select id="cli"></select></label>
<p>
<button id="bnew">＋ Nuevo manual</button>
<label style="display:inline-block">📷 Foto / imagen
<input id="foto" type="file" accept="image/*" capture="environment" style="display:inline;width:auto"></label>
<button id="bcam" type="button">📹 Tomar foto (cámara)</button>
</p>
<video id="vid" width="100%" style="display:none;border-radius:8px" autoplay playsinline></video>
<p id="camrow" style="display:none"><button id="bshot" type="button">Capturar</button>
<button id="bcancel" type="button">Cancelar</button></p>
<canvas id="cv" style="display:none"></canvas>
<div id="aviso" class="card" style="display:none;border-top-color:var(--err)"></div>
</div>
<div class="card"><h2>Listado</h2>
<table id="t"><tr><th>ID</th><th>Número</th><th>Emisor</th><th>Rubro</th><th>Total</th><th>Estado</th><th></th></tr></table></div>
<div class="card" id="fcard" style="display:none"><h2 id="ftitle">Comprobante</h2>
<form id="f">
<input type="hidden" id="fid">
<label>RUC emisor <input id="ruc"></label>
<label>Razón social <input id="raz"></label>
<label>Timbrado <input id="tim"></label>
<label>Nro (000-000-0000000) <input id="nro"></label>
<label>Fecha <input id="fec" placeholder="DD/MM/YYYY"></label>
<label>Grav10 <input id="g10" type="number" step="0.01"></label>
<label>Grav5 <input id="g5" type="number" step="0.01"></label>
<label>Exenta <input id="exe" type="number" step="0.01"></label>
<label>Total <input id="tot" type="number" step="0.01"></label>
<label>Rubro <input id="rub"></label>
<p><button>Guardar</button> <button id="bcancel2" type="button">Cancelar</button></p></form></div>
<div class="card"><h2>Respuesta</h2><pre id="out">—</pre></div>
<div id="overlay"><div class="spinner"></div><p id="overlay-msg">Procesando…</p></div>
<script>
const out = document.getElementById('out'), overlay = document.getElementById('overlay'),
      omsg = document.getElementById('overlay-msg'), aviso = document.getElementById('aviso');
function bloquear(on, msg){ overlay.classList.toggle('visible', on);
  if (msg) omsg.textContent = msg;
  document.querySelectorAll('button').forEach(b => b.disabled = on); }
const badge = e => { const c = ({PENDIENTE:'off',VALIDADO:'on',RECHAZADO:'err'})[e] || 'off';
  return '<span class="badge ' + c + '">' + e + '</span>'; };
fetch('/clientes').then(r => r.json()).then(cs => {
  cli.innerHTML = cs.map(c => `<option value="${c.id}">${c.ruc} — ${c.razon}</option>`).join('');
  listar();
});
cli.onchange = listar;
async function listar(){
  const rs = await (await fetch('/comprobantes/' + cli.value)).json();
  t.innerHTML = '<tr><th>ID</th><th>Número</th><th>Emisor</th><th>Rubro</th><th>Total</th><th>Estado</th><th></th></tr>' +
    rs.map(r => `<tr><td>${r.id}</td><td><b>${r.nro||'—'}</b></td><td>${r.razon||r.ruc_emisor}</td>
      <td>${r.rubro||'—'}</td><td>${r.total}</td><td>${badge(r.estado)}</td>
      <td><button onclick="editar(${r.id})">Editar</button>
      <button onclick="eliminar(${r.id})">Borrar</button></td></tr>`).join('');
}
function form(v){ fid.value=v.id||''; ruc.value=v.ruc_emisor||v.ruc||''; raz.value=v.razon||v.razon_emisor||'';
  tim.value=v.timbrado||''; nro.value=v.nro||v.nro_comprobante||''; fec.value=v.fecha||'';
  g10.value=v.grav10||0; g5.value=v.grav5||0; exe.value=v.exenta||0; tot.value=v.total||0; rub.value=v.rubro||'';
  ftitle.textContent = v.id ? 'Editar #' + v.id : 'Nuevo comprobante'; fcard.style.display='block';
  window.scrollTo(0, fcard.offsetTop); }
bnew.onclick = () => form({});
bcancel2.onclick = () => fcard.style.display='none';
async function editar(id){
  const rs = await (await fetch('/comprobantes/' + cli.value)).json();
  const r = rs.find(x => x.id === id); if (r) form(r);
}
async function eliminar(id){
  if (!confirm('Borrar comprobante #' + id + '?')) return;
  bloquear(true, 'Borrando…');
  try { out.textContent = JSON.stringify(await (await fetch('/comprobantes/'+id,{method:'DELETE'})).json(), null, 2); listar(); }
  finally { bloquear(false); }
}
f.onsubmit = async e => {
  e.preventDefault(); bloquear(true, 'Guardando…');
  const body = {ruc_emisor:ruc.value, razon_emisor:raz.value, timbrado:tim.value, nro_comprobante:nro.value,
    fecha:fec.value, grav10:+g10.value||0, grav5:+g5.value||0, exenta:+exe.value||0, total:+tot.value||0, rubro:rub.value};
  try {
    const url = fid.value ? '/comprobantes/'+fid.value : '/comprobantes/'+cli.value;
    const r = await fetch(url, {method: fid.value?'PUT':'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    out.textContent = JSON.stringify(await r.json(), null, 2);
    fcard.style.display='none'; listar();
  } finally { bloquear(false); }
};
async function subirFoto(blob, nombre){
  const fd = new FormData(); fd.append('file', blob, nombre || 'foto.jpg');
  bloquear(true, 'Evaluando nitidez y extrayendo datos…');
  try {
    const j = await (await fetch(`/comprobantes/${cli.value}/desde-imagen`, {method:'POST', body:fd})).json();
    if (!j.ok && j.codigo === 'IMAGEN_BORROSA') {
      aviso.style.display='block';
      aviso.innerHTML = '<b>⚠ ' + j.mensaje + '</b><br>Nitidez: ' + j.calidad.nitidez +
        ' (mín. 100) · ' + j.calidad.ancho + 'x' + j.calidad.alto + '. Toma la foto de nuevo.';
      out.textContent = JSON.stringify(j.calidad, null, 2);
      return;
    }
    aviso.style.display='none';
    out.textContent = JSON.stringify(j, null, 2);
    form(j); listar();
  } finally { bloquear(false); }
}
foto.onchange = () => { if (foto.files[0]) subirFoto(foto.files[0], foto.files[0].name); foto.value=''; };
let stream = null;
bcam.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    vid.srcObject = stream; vid.style.display='block'; camrow.style.display='block';
  } catch(e) { alert('Sin acceso a cámara (usa HTTPS o localhost). Usa el botón Foto/imagen.'); }
};
bcancel.onclick = () => { stream && stream.getTracks().forEach(t=>t.stop());
  vid.style.display='none'; camrow.style.display='none'; };
bshot.onclick = () => {
  cv.width = vid.videoWidth; cv.height = vid.videoHeight;
  cv.getContext('2d').drawImage(vid, 0, 0);
  cv.toBlob(b => subirFoto(b, 'foto.jpg'), 'image/jpeg', 0.92);
  bcancel.onclick();
};
</script>
{% endblock %}
